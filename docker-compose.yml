services:
  postgres:
    image: postgres:18
    container_name: branchflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-branchflow}
      POSTGRES_USER: ${POSTGRES_USER:-branchflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "5432:5432"
    volumes:
      - branchflow_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: branchflow-api
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-branchflow}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    container_name: branchflow-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  branchflow_pgdata:
