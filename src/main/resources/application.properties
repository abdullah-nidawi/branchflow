spring.application.name=branchflow
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/branchflow}
spring.datasource.username=${POSTGRES_USER:branchflow}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

branchflow.security.admin.username=${ADMIN_USERNAME:admin}
branchflow.security.admin.password=${ADMIN_PASSWORD:}
branchflow.security.manager.username=${MANAGER_USERNAME:manager}
branchflow.security.manager.password=${MANAGER_PASSWORD:}
branchflow.security.employee.username=${EMPLOYEE_USERNAME:employee}
branchflow.security.employee.password=${EMPLOYEE_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.data.web.pageable.max-page-size=100
